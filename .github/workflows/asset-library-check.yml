name: Asset library check

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

jobs:
  asset-library:
    name: Catalog and accessor consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check asset library
        run: python3 scripts/check-asset-library.py
