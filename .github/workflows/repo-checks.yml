name: Repo Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. Groups are per PR, so
# PRs never cancel each other; pushes to main get a unique group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-checks:
    name: Fixture Literals, Wear Logging, Copy Verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Python dependencies (hash-verified)
        # Installed before image-guard parity (OpenAPI key sweep needs PyYAML).
        run: |
          set -euo pipefail
          pip3 install --require-hashes --target "$RUNNER_TEMP/pydeps" \
            -r scripts/ci-requirements.txt
          echo "PYTHONPATH=$RUNNER_TEMP/pydeps" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Worker dependencies (image-guard parity)
        run: npm ci
        working-directory: backend/workers

      - name: Image-guard parity (client strip list == Worker reject list)
        run: python3 scripts/check-image-guard-parity.py

      - name: No sample wardrobe literals (CC-01)
        run: ./scripts/check-no-founder-literals.sh

      - name: Wear-logging rules
        run: python3 scripts/check-wear-logging.py

      - name: Cost-per-wear copy cases
        run: python3 scripts/verify-cost-per-wear-copy.py

      - name: Generate-failure copy (no raw HTTP/URL errors)
        run: python3 scripts/verify-generate-failure-copy.py

      - name: OpenAPI contract examples (#220)
        run: |
          set -euo pipefail
          python3 -c 'from importlib.metadata import version; import yaml; print("pyyaml", version("pyyaml"), "jsonschema", version("jsonschema"), "from", yaml.__file__)'
          python3 scripts/verify-openapi-contract-examples.py
