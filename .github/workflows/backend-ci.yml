name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. Groups are per PR, so
# PRs never cancel each other; pushes to main get a unique group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    name: Backend Type Check, Tests & Eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/outfit-engine/package-lock.json'

      - name: Install dependencies
        working-directory: backend/outfit-engine
        run: npm ci

      - name: Type check
        working-directory: backend/outfit-engine
        run: npm run typecheck

      - name: Run tests
        working-directory: backend/outfit-engine
        run: npm test

      - name: Run deterministic eval
        working-directory: backend/outfit-engine
        run: |
          set -e
          npm run eval -- run --models deterministic --scenarios all --repeats 2
        env:
          # Fail on any non-zero exit (failed scenarios or non-deterministic results)
          CI: true

      - name: Latency vs wardrobe size gate
        working-directory: backend/outfit-engine
        run: npm run latency:gate
        env:
          CI: true
          LATENCY_REPEATS: "5"

  workers-checks:
    name: Workers Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/workers/package-lock.json'

      - name: Install dependencies
        working-directory: backend/workers
        run: npm ci

      - name: Type check
        working-directory: backend/workers
        run: npm run typecheck

      - name: Run tests
        working-directory: backend/workers
        run: npm test

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install @redocly/cli
        run: npm install -g @redocly/cli@2.53.3

      - name: Lint OpenAPI spec
        run: redocly lint docs/openapi.yaml --format=stylish
