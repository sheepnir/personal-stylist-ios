name: ForegroundMaskHarness
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ForegroundMaskHarness:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ForegroundMaskHarness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ForegroundMaskHarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ForegroundMaskHarness
schemes:
  ForegroundMaskHarness:
    build:
      targets:
        ForegroundMaskHarness: all
        ForegroundMaskHarnessTests: [test]
    test:
      targets: [ForegroundMaskHarnessTests]
