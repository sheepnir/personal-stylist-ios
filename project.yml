name: PersonalStylist
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Personal Stylist
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    CURRENT_PROJECT_VERSION: "2026092601"
    MARKETING_VERSION: "0.1.0"
    # HTTPS via Apple TLS / URLSession only — skip the export-compliance prompt.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSCameraUsageDescription: "To photograph a garment. The photo stays on this iPhone for your wardrobe."
targets:
  PersonalStylist:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Personal Stylist
        OUTFIT_ENGINE_BASE_URL: "$(OUTFIT_ENGINE_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "To photograph a garment. The photo stays on this iPhone for your wardrobe."
    sources:
      - path: App
      - path: Assets.xcassets
      - path: Persistence
      - path: Design
      - path: Features
      - path: fixtures/wardrobe/garments.json
        buildPhase: resources
      - path: fixtures/wardrobe/sets.json
        buildPhase: resources
      - path: fixtures/profile/founder-seed.json
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    # PRODUCT_BUNDLE_IDENTIFIER is defined in Config/{Debug,Release}.xcconfig so the
    # untracked Config/LocalSecrets.xcconfig can override it; a target-level value
    # here would take precedence over every xcconfig.
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
  PersonalStylistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # #237 Tests/Support/README.md + #215 LegacyStores/README.md both flatten to
      # README.md in the xctest bundle — exclude docs; keep store packages via resources.
      - path: Tests
        excludes:
          - "**/*.md"
          - "Fixtures/LegacyStores/**"
    resources:
      - path: Tests/Fixtures/LegacyStores
        excludes:
          - "**/*.md"
        buildPhase: resources
      - path: fixtures/image-guard/corpus.json
        buildPhase: resources
    dependencies:
      - target: PersonalStylist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PersonalStylistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PersonalStylist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
